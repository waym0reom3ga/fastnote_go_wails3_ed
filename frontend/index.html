<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastNote</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="btn-open">Open</button>
      <button id="btn-save">Save</button>
      <button id="btn-saveas">Save As</button>
      <button id="btn-export-html">Export HTML</button>
      <button id="btn-export-pdf">Export PDF</button>
      <button id="btn-theme">Theme</button>
    </div>
    <div id="content">
      <textarea id="editor" placeholder="Write markdown here..."></textarea>
      <div id="preview"></div>
    </div>
    <div id="status"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
